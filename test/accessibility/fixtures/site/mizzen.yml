# A tiny site whose pages exercise every Lateen layout and both text directions.
# The accessibility gate builds it with the theme's own layouts, chrome, and components.
title: Lateen accessibility fixture
description: Representative pages for the accessibility gate.
lang: en
url: https://example.com
base: ""
collections:
  timeline:
    source: _data/a11y-timeline.json
    id: id
  books:
    source: _data/books.json
    id: id
    template: _templates/books.md
    permalink: /books/{id}/
    views:
      embed:
        template: _templates/books-embed.md
        permalink: /books/{id}/embed/
        layout: embedded
    index:
      fields:
        - title
        - pages
        - published
languages:
  - code: en
    name: English
    prefix: ""
  - code: fa
    name: فارسی
    prefix: /fa
  - code: ar
    name: العربية
    prefix: /ar
navigation: _data/navigation.yml
search: false
repository:
  url: https://github.com/example/fixture
  branch: main
theme:
  options:
    sourceMode:
      editor: "vscode://file/{path}:{line}:{column}"
    installTabs:
      managers:
        - name: npm
          command: npm install {package}
        - name: pnpm
          command: pnpm add {package}
        - name: yarn
          command: yarn add {package}
    status:
      values:
        done:
          tone: positive
          label: { en: Done, fa: انجام شد, ar: مكتمل }
          description:
            en: Shipped and released.
            fa: منتشر و ارائه شده است.
            ar: تم شحنه وإصداره.
        late:
          tone: negative
          label: { en: Late, fa: دیرکرده, ar: متأخر }
          description:
            en: Past its date.
            fa: از تاریخ خود گذشته است.
            ar: تجاوز موعده.
        draft:
          tone: neutral
          label: { en: Draft, fa: پیش‌نویس, ar: مسودة }
    preset: graphite
    brand:
      accent: "#2f6f9f"
      fonts:
        sans:
          family: "Example Sans"
          files:
            - src: /fonts/example-sans.woff2
              weight: 400
        mono:
          family: "Example Mono"
          files:
            - src: /fonts/example-mono.woff2
              weight: 400
