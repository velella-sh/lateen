# A tiny site whose pages exercise every Lateen layout and both text directions.
# The accessibility gate builds it with the theme's own layouts, chrome, and components.
title: Lateen accessibility fixture
description: Representative pages for the accessibility gate.
lang: en
url: https://example.com
asOf: 2026-06-01
base: ""
repository:
  url: https://github.com/example/example-site
  branch: main
collections:
  timeline:
    source: _data/a11y-timeline.json
    id: id
  books:
    source: _data/books.json
    id: id
    template: _templates/books.md
    permalink: /books/{id}/
    dates: [published, updated]
    derived:
      daysLeft: { field: published, kind: days-left }
      state:
        field: published
        bands:
          - { below: 0, value: expired }
          - { below: 90, value: soon }
          - { value: later }
    changelog:
      track: [title, pages]
      pages: true
    views:
      embed:
        template: _templates/books-embed.md
        permalink: /books/{id}/embed/
        layout: embedded
    index:
      fields:
        - title
        - pages
        - published
        - derived.daysLeft
    search:
      filters: [author, published]
      sort: [title, published]
  glossary:
    source: _data/a11y-glossary.json
    id: id
languages:
  - code: en
    name: English
    prefix: ""
  - code: fa
    name: فارسی
    prefix: /fa
  - code: ar
    name: العربية
    prefix: /ar
navigation: _data/navigation.yml
search: false
theme:
  options:
    glossary:
      collection: glossary
      page:
        en: /glossary/
        fa: /fa/glossary/
        ar: /ar/glossary/
    sourceMode:
      editor: "vscode://file/{path}:{line}:{column}"
    installTabs:
      managers:
        - name: npm
          command: npm install {package}
        - name: pnpm
          command: pnpm add {package}
        - name: yarn
          command: yarn add {package}
    status:
      values:
        done:
          tone: positive
          label: { en: Done, fa: انجام شد, ar: مكتمل }
          description:
            en: Shipped and released.
            fa: منتشر و ارائه شده است.
            ar: تم شحنه وإصداره.
        late:
          tone: negative
          label: { en: Late, fa: دیرکرده, ar: متأخر }
          description:
            en: Past its date.
            fa: از تاریخ خود گذشته است.
            ar: تجاوز موعده.
        draft:
          tone: neutral
          label: { en: Draft, fa: پیش‌نویس, ar: مسودة }
        expired:
          tone: negative
          label: { en: Expired, fa: گذشته, ar: منتهٍ }
        soon:
          tone: caution
          label: { en: Soon, fa: نزدیک, ar: قريب }
        later:
          tone: neutral
          label: { en: Later, fa: بعدتر, ar: لاحقًا }
    preset: graphite
    brand:
      accent: "#2f6f9f"
      fonts:
        sans:
          family: "Example Sans"
          files:
            - src: /fonts/example-sans.woff2
              weight: 400
        mono:
          family: "Example Mono"
          files:
            - src: /fonts/example-mono.woff2
              weight: 400

calendars:
  books:
    collection: books
    events:
      - name: updated
        field: updated
        title: "{title} updated"
    groupBy: author
