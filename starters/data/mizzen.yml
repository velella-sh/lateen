# A catalogue site for an invented field-kit collection, read by Mizzen. Replace the title, url, data, and statuses.
title: Driftwood
description: Driftwood is an invented field-kit catalogue, used here to show a complete data site.
lang: en
url: https://example.com
base: ""
search: { text: 300 }
repository:
  url: https://github.com/example/driftwood
  branch: main
  dir: ""
collections:
  kits:
    source: _data/kits.yml
    id: id
    template: _templates/kit.md
    permalink: /kits/{id}/
    schema: _data/kits.schema.json
    dates: [added, updated]
    references:
      companions: kits
    lifecycle:
      field: status
      states: [in-service, maintenance, retired]
      retired: [retired]
      replacement: replaced_by
      url: retain
    views:
      notes:
        template: _templates/kit-notes.md
        permalink: /kits/{id}/notes/
    search:
      filters: [category, status]
      sort: [updated]
    changelog:
      track: [status]
      pages: true
    index:
      fields: [id, name, category, status, updated, weight_grams, pieces]
calendars:
  kit-updates:
    collection: kits
    events:
      - name: update
        field: updated
        title: "{name} updated"
feeds:
  kit-updates:
    collection: kits
    title: Driftwood kit updates
    date: updated
    formats: [atom, rss, json]
theme:
  name: "@velella/lateen"
  options:
    status:
      values:
        in-service:
          tone: positive
          label: In service
          description: Ready to pack and use.
        maintenance:
          tone: caution
          label: Needs care
          description: Usable, but a part needs attention.
        retired:
          tone: neutral
          label: Retired
          description: Kept for the record only.
    footer:
      copyright: "© Example"
      license: "MIT license"
