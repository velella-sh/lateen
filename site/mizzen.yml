# Documentation site for lateen, read by Mizzen.
title: Lateen
description: A docs theme for people and agents, built on Mizzen.
lang: en
url: https://velella.sh
base: /lateen
network:
  source: https://velella.sh/lateen/brand/network.json
  project: lateen
repository:
  url: https://github.com/velella-sh/lateen
  branch: main
  dir: site
theme:
  options:
    preset: lateen
    network:
      switcher: false
      footer: false
      search: false
    glossary:
      collection: glossary
      page: /components/glossary/
    installTabs:
      managers:
        - name: npm
          command: npm install {package}
        - name: pnpm
          command: pnpm add {package}
        - name: yarn
          command: yarn add {package}
    logo:
      light: /brand/mark-light.svg
      dark: /brand/mark-dark.svg
    favicon:
      svg: /brand/favicon.svg
      ico: /brand/favicon.ico
      apple: /brand/apple-touch-icon.png
    footer:
      copyright: "© Velella"
      license: "MIT license"
      links:
        - title: GitHub
          url: https://github.com/velella-sh/lateen
        - title: a Velella project
          url: https://velella.sh/
        - title: Changelog
          url: /changelog/
        - title: Accessibility
          url: /accessibility/
        - title: Docs standard
          url: /standards/
    status:
      values:
        shipped:
          tone: positive
          label:
            en: Shipped
            fa: ارسال شد
          description: The work is done and released.
        pending:
          tone: caution
          label: Pending
          description: Waiting on a review.
        blocked:
          tone: negative
          label:
            en: Blocked
            fa: مسدود
          description: Something must change first.
        draft:
          tone: info
          label: Draft

collections:
  books:
    source: _data/books.yml
    id: slug
    template: _templates/books.md
    permalink: /books/{id}/
    dates: [published]
    referenceDate: 2026-03-01
    index:
      fields:
        - title
        - pages
        - published
        - format
    search:
      filters: [format, published]
      sort: [title, published]
  glossary:
    source: _data/glossary.json
    id: id

calendars:
  books:
    collection: books
    events:
      - name: published
        field: published
        title: "{title} published"
