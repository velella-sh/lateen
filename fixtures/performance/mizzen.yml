# A fixed site the performance budget measures. Its pages are not documentation; they are the
# representative routes scripts/performance-budget.ts builds and records. Keep `base` empty: the
# script reads asset URLs from the built HTML as paths from the output folder.
title: Lateen performance fixture
description: A fixed site for measuring the theme's shipped JavaScript and CSS.
lang: en
base: ""
search: false
theme:
  options:
    installTabs:
      managers:
        - name: npm
          command: npm install {package}
        - name: pnpm
          command: pnpm add {package}
        - name: yarn
          command: yarn add {package}
    status:
      values:
        done: { tone: positive, label: Done, description: Shipped and released. }
        late: { tone: negative, label: Late, description: Past its date. }
    preset: harbor
    brand:
      accent: "#0b6e4f"
      density: compact
    footer:
      copyright: "Performance fixture"

collections:
  timeline:
    source: _data/timeline.json
    id: id
  books:
    source: _data/books.json
    id: id
    template: _templates/books.md
    permalink: /books/{id}/

network:
  source: network.yml
  project: perf
