# A fixed site the performance budget measures. Its pages are not documentation; they are the
# representative routes scripts/performance-budget.ts builds and records. Keep `base` empty: the
# script reads asset URLs from the built HTML as paths from the output folder.
title: Lateen performance fixture
description: A fixed site for measuring the theme's shipped JavaScript and CSS.
lang: en
asOf: 2026-06-01
url: https://example.com
base: ""
search: false
repository:
  url: https://github.com/example/fixture
  branch: main
theme:
  options:
    sourceMode:
      editor: "vscode://file/{path}:{line}:{column}"
    installTabs:
      managers:
        - name: npm
          command: npm install {package}
        - name: pnpm
          command: pnpm add {package}
        - name: yarn
          command: yarn add {package}
    status:
      values:
        done: { tone: positive, label: Done, description: Shipped and released. }
        late: { tone: negative, label: Late, description: Past its date. }
        expired: { tone: negative, label: Expired, description: Past its date. }
        soon: { tone: caution, label: Soon, description: Close to its date. }
        later: { tone: neutral, label: Later, description: Some time away. }
    preset: harbor
    brand:
      accent: "#0b6e4f"
      density: compact
    footer:
      copyright: "Performance fixture"

collections:
  timeline:
    source: _data/timeline.json
    id: id
  books:
    source: _data/books.json
    id: id
    template: _templates/books.md
    permalink: /books/{id}/
    dates: [published]
    derived:
      daysLeft: { field: published, kind: days-left }
      state:
        field: published
        bands:
          - { below: 0, value: expired }
          - { below: 90, value: soon }
          - { value: later }
    changelog:
      track: [title, published]
      pages: true
    views:
      embed:
        template: _templates/books-embed.md
        permalink: /books/{id}/embed/
        layout: embedded
    index:
      fields:
        - title
        - author
        - published
        - derived.daysLeft
    search:
      filters: [author]
      sort: [title, published]

network:
  source: network.yml
  project: perf

calendars:
  books:
    collection: books
    events:
      - name: published
        field: published
        title: "{title} published"
    groupBy: author
