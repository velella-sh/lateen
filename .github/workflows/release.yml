name: release

# Publishes @velella/lateen to npm whenever a release tag is pushed or a GitHub Release is published.
#
#   1. acceptance  checks the tag, packs the commit, installs the tarball and the exact Mizzen
#                  version into an empty project, builds the public acceptance site, and runs the
#                  Playwright cases. The report and the tarball are the only artifact publishing
#                  may use.
#   2. publish     publishes that same tarball with provenance. It holds the only credential in the
#                  workflow (an OIDC token) and runs only the report gate and tarball selection,
#                  never a repository build.
#   3. acceptance-published  installs the version npm now serves and runs the cases again.
#   4. github-release         writes the GitHub Release for the tag, only after the post-publish
#                             acceptance run passed.
#
# There is no npm token anywhere: npm trusted publishing exchanges the job's OIDC identity for a
# short-lived publish credential. One-time setup on npmjs.com is in docs/release.md.
#
# A release whose version has a prerelease suffix (0.3.0-rc.1) goes to the `next` dist-tag; any
# other goes to `latest`. To retry a failed publish, run this workflow by hand with the tag; an
# already-published version skips npm publish but is accepted and verified again, so a retry is
# safe and never marks an unverified package as accepted.
# Tags without .node-version use Node 24 and its bundled npm for the older acceptance script.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v0.2.3"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      # The helper comes from the default branch, never from the dispatched tag: the tag input is
      # unchecked text, so it is validated and resolved before anything checks it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag before checkout
        id: check
        working-directory: lateen
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          # Keep in sync with TAG_PATTERN in scripts/release-plan.ts; a test compares them.
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $pattern ]]; then
            echo "::error::$TAG is not a bare release tag such as v0.2.3. Pass the tag itself, not a branch, a full ref, or a commit range."
            exit 1
          fi
          if ! git fetch --quiet --depth 1 origin "refs/tags/$TAG"; then
            echo "::error::$TAG does not name a tag in this repository. Push the tag before releasing it."
            exit 1
          fi
          commit="$(git rev-parse FETCH_HEAD^{commit})"
          version="$(git show "$commit:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          node scripts/release-plan.ts --tag "$TAG" --version "$version" --check-tag --github-output "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  acceptance:
    name: acceptance
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
      published: ${{ steps.meta.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: lateen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('lateen/.node-version') != '' && 'lateen/.node-version' || '' }}
          node-version: ${{ hashFiles('lateen/.node-version') == '' && '24' || '' }}
          cache: npm
          cache-dependency-path: lateen/package-lock.json
      - name: Set up npm
        if: hashFiles('lateen/.node-version') != ''
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Check the tag target and choose the dist-tag
        id: meta
        working-directory: lateen
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          # Preflight validated this tag's syntax and package version; the checkout must still be
          # the exact commit it resolved, so a moved tag cannot release a different package.
          if [ "$(git rev-parse HEAD)" != "$COMMIT" ]; then
            echo "::error::$TAG now names $(git rev-parse HEAD), not the commit preflight validated. Do not move a release tag."
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          # Releases come from main only: the tagged commit must be reachable from it.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Merge the release commit first."
            exit 1
          fi
          served="$(npm view "$name@$version" version 2>/dev/null || true)"
          node scripts/release-plan.ts --tag "$TAG" --version "$VERSION" --served "$served" --github-output "$GITHUB_OUTPUT"
      # The gate runs on a retry too: an already-published version still needs fresh acceptance
      # evidence from the tagged commit before the published package can be verified against it.
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Acceptance gate
        run: npm run test:acceptance -- --report ../acceptance/report.json
        working-directory: lateen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance
          path: acceptance
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: acceptance
    if: needs.acceptance.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `npm` environment is what the npm trusted publisher is bound to. Add required reviewers
    # to it in the repository settings to gate every release behind a manual approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@velella/lateen/v/${{ needs.acceptance.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('lateen/.node-version') != '' && 'lateen/.node-version' || '' }}
          node-version: ${{ hashFiles('lateen/.node-version') == '' && '24' || '' }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: lateen/package-lock.json
      - name: Set up npm
        if: hashFiles('lateen/.node-version') != ''
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance
          path: acceptance
      - name: Require the acceptance report to pass
        working-directory: lateen
        run: |
          set -euo pipefail
          tarball="$(node scripts/release-tarball.ts --dir ../acceptance --report ../acceptance/report.json)"
          node scripts/acceptance.ts --gate ../acceptance/report.json --tarball "$tarball"
      - name: Publish the tested tarball with provenance
        working-directory: lateen
        env:
          DIST_TAG: ${{ needs.acceptance.outputs.dist-tag }}
        run: |
          set -euo pipefail
          tarball="$(node scripts/release-tarball.ts --dir ../acceptance --report ../acceptance/report.json)"
          npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
          echo "Published ${{ needs.acceptance.outputs.version }} to \`$DIST_TAG\` from $(basename "$tarball")" >> "$GITHUB_STEP_SUMMARY"

  # Installs the exact version npm now serves and runs the same cases again. A failure fails the
  # release run, so the release epic stays open until a post-publish run passes. The digest check
  # proves publishing shipped the bytes the acceptance gate tested. On a retry (published=true)
  # npm publish is skipped, but this job still installs the published version and proves its
  # digest against the acceptance evidence from the tagged commit.
  acceptance-published:
    name: acceptance published
    needs: [acceptance, publish]
    if: always() && needs.acceptance.result == 'success' && (needs.acceptance.outputs.published == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('lateen/.node-version') != '' && 'lateen/.node-version' || '' }}
          node-version: ${{ hashFiles('lateen/.node-version') == '' && '24' || '' }}
          cache: npm
          cache-dependency-path: lateen/package-lock.json
      - name: Set up npm
        if: hashFiles('lateen/.node-version') != ''
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance
          path: acceptance
      - name: Run the shipped cases against the npm package
        working-directory: lateen
        env:
          VERSION: ${{ needs.acceptance.outputs.version }}
        run: npm run test:acceptance -- --theme "@velella/lateen@$VERSION" --report ../published/report.json
      - name: Prove the published tarball is the tested tarball
        working-directory: lateen
        run: |
          set -euo pipefail
          tarball="$(node scripts/release-tarball.ts --dir ../published --report ../acceptance/report.json)"
          node scripts/acceptance.ts --gate ../acceptance/report.json --tarball "$tarball"

  # A release is only a release once the post-publish acceptance run passed, on a first publish
  # and on a retry alike: a failed case or digest check leaves the GitHub Release uncreated
  # instead of announcing a broken version.
  github-release:
    name: github release
    needs: [acceptance, publish, acceptance-published]
    if: always() && needs.acceptance.result == 'success' && needs['acceptance-published'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.acceptance.outputs.version }}
          PRERELEASE: ${{ needs.acceptance.outputs.prerelease }}
          LATEST: ${{ needs.acceptance.outputs.latest }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ "$LATEST" != true ]; then args+=(--latest=false); fi
          gh release create "$TAG" --verify-tag --title "Lateen $VERSION" --generate-notes "${args[@]}"
