name: record-visual

# Temporary: records the visual baselines on the same runner as the visual gate, for the branch
# that restores main. This file is removed before the branch merges.
on:
  push:
    branches: [fix/a11y-back-to-top]

permissions:
  contents: read

jobs:
  record:
    if: contains(github.event.head_commit.message, '[record-visual]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Set up npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Record the baselines
        run: npm run ui:build && node scripts/test-visual.ts --update
        env:
          VISUAL_CHECKS: strict
      - name: Upload the recorded baselines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: test/visual/baselines
          retention-days: 3
