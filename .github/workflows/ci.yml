name: ci

# Tests, type check, and a build of the package as it installs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Test
        run: npm test
        working-directory: lateen
      - name: Component fixture inventory
        run: node --test test/visual/inventory.test.ts
        working-directory: lateen
      - name: Type check
        run: npm run typecheck
        working-directory: lateen
      - name: Check the starters
        run: npm run check:starters
        working-directory: lateen
      - name: Performance budget
        run: npm run test:performance
        working-directory: lateen
      - name: Asset manifest
        run: node scripts/asset-manifest.ts --report reports/asset-manifest.json
        working-directory: lateen
      - name: Build the packages and install them
        run: scripts/smoke-package.sh
        working-directory: lateen

  # Builds main and the pull request from the same fixture routes and compares the gzip bytes every
  # route loads, naming each changed CSS, JavaScript, or font asset. A new asset or growth past the
  # tolerance fails. The report uploads even when the comparison fails.
  performance-compare:
    name: performance-compare
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: head/.node-version
      - name: Set up npm
        working-directory: head
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install the pull request
        run: npm ci --no-audit --no-fund
        working-directory: head
      - name: Install the base branch
        run: npm ci --no-audit --no-fund
        working-directory: base
      - name: Build the base manifest
        run: node scripts/asset-manifest.ts --report asset-manifest.json
        working-directory: base
      - name: Build the pull request manifest
        run: node scripts/asset-manifest.ts --report asset-manifest.json
        working-directory: head
      - name: Compare
        run: node head/scripts/performance-compare.ts --base base/asset-manifest.json --head head/asset-manifest.json --reviewed head/fixtures/performance/reviewed-assets.json --report reports/performance-compare.json
      - name: Upload the comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-compare
          path: head/reports/performance-compare.json
          retention-days: 7

  # Builds the docs site and a fixture site, then runs axe-core in Chromium over the layouts, both
  # themes, the right-to-left locales, and the open drawer and search states. Fails on a critical or
  # serious violation that test/accessibility/baseline.json does not list.
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Accessibility gate
        run: npm run test:a11y
        working-directory: lateen
      - name: Screen-reader path audit
        run: npm run ui:build && node scripts/audit-screen-reader.ts
        working-directory: lateen
      - name: Upload the screen-reader audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-audit
          path: lateen/test/accessibility/screen-reader.json
          retention-days: 7

  # Builds the docs site, the data/API/search/versions fixture, and the blog fixture, then visits
  # representative production routes in Chromium. Fails on console errors, uncaught page errors,
  # failed or 4xx/5xx same-origin requests, and external requests outside the script's allowlist.
  # The JSON report is kept as CI evidence.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Browser smoke gate
        run: npm run test:smoke
        working-directory: lateen
      - name: Mobile search opening budget
        run: npm run ui:build && node scripts/search-open-budget.ts --report test/smoke/out/search-open.json
        working-directory: lateen
      - name: Upload the search opening report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-open-report
          path: lateen/test/smoke/out/search-open.json
          retention-days: 7
      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: lateen/test/smoke/out/report.json
          retention-days: 7

  # Public acceptance: packs the package, installs it and the exact Mizzen version into an empty
  # project, builds test/acceptance/site with the installed CLI and runs the Playwright cases. The
  # release workflow runs the same gate and publishes only the tarball it passed.
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Acceptance gate
        run: npm run test:acceptance
        working-directory: lateen

  # Pixel gate: shoots the matrix in the pinned Chromium on the pinned runner, compares it with the
  # committed baselines, and puts a page/entry/share table in the step summary. A pull request that
  # changes a baseline must carry the `visual-change` label; without it the job turns red.
  visual:
    name: visual
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('lateen/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Require the visual-change label for baseline edits
        if: github.event_name == 'pull_request'
        working-directory: lateen
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed="$(git diff --name-only "$BASE" HEAD -- test/visual/baselines)"
          if [ -z "$changed" ]; then exit 0; fi
          case " $LABELS " in
            *" visual-change "*) echo "baseline changes carry the visual-change label" ;;
            *) echo "::error::test/visual/baselines changed without the visual-change label"; echo "$changed"; exit 1 ;;
          esac
      - name: Visual gate
        run: npm run test:visual
        working-directory: lateen
        timeout-minutes: 8
        env:
          VISUAL_CHECKS: strict
      - name: Design check
        run: npm run check:design
        working-directory: lateen
      - name: Summarize the visual gate
        if: always()
        working-directory: lateen
        run: |
          node --input-type=module - <<'EOF'
          import { existsSync, readFileSync, appendFileSync } from "node:fs";
          const file = "test/visual/out/report.json";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!existsSync(file)) {
            appendFileSync(summary, "The visual gate wrote no report.\n");
            process.exit(0);
          }
          const rows = JSON.parse(readFileSync(file, "utf8"));
          const lines = ["| Page | Matrix entry | Changed share | Result |", "| --- | --- | ---: | --- |"];
          for (const row of rows) {
            const share = row.share === null ? "—" : `${(row.share * 100).toFixed(3)}%`;
            const result = row.flaky ? "flaky" : row.status;
            lines.push(`| ${row.page} | ${row.entry} | ${share} | ${result} |`);
          }
          appendFileSync(summary, `${lines.join("\n")}\n`);
          EOF
      - name: Upload the visual review images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-out
          path: lateen/test/visual/out
          retention-days: 7

  # Measures line coverage and publishes it for the README badge. It runs on main only and holds the
  # only write permission in this workflow: it can push the `badges` branch and nothing else. The badge
  # is a shields.io endpoint badge reading coverage.json from that branch, so the number follows main.
  coverage:
    name: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Measure coverage
        working-directory: lateen
        run: |
          npm run test:coverage
          echo "line coverage: $(node -p "require('./coverage/coverage.json').message")" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf badges
          git init --quiet badges
          cd badges
          git checkout --quiet -b badges
          cp "$GITHUB_WORKSPACE/lateen/coverage/coverage.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): coverage for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
