name: deploy-site

# Builds site/ with Mizzen and the Lateen theme and deploys it to this repository's GitHub Pages site,
# https://velella.sh/lateen/. Pages' source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lateen/.node-version
          cache: npm
          cache-dependency-path: lateen/package-lock.json
      - name: Set up npm
        working-directory: lateen
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: lateen
      - name: Install Chromium for the accessibility gate
        run: npx playwright install --with-deps chromium
        working-directory: lateen
      - name: Write the accessibility report
        run: npm run ui:build && node scripts/test-a11y.ts --report site/_data/accessibility-report.json
        working-directory: lateen
      - name: Write the performance report
        run: node scripts/performance-budget.ts --report site/_data/performance-report.json
        working-directory: lateen
      - name: Require both reports
        run: test -s site/_data/accessibility-report.json && test -s site/_data/performance-report.json
        working-directory: lateen
      - name: Build the site
        run: lateen/node_modules/.bin/mizzen build lateen/site --theme lateen --out "$RUNNER_TEMP/site"
      - name: Build the starter demos
        run: node lateen/scripts/build-starter-demos.ts --out "$RUNNER_TEMP/site" --base /lateen
      - name: Check the site
        run: lateen/node_modules/.bin/mizzen check lateen/site --theme lateen
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke-test the deployed site
        working-directory: lateen
        run: node scripts/smoke-deployed.ts --base "${{ steps.deploy.outputs.page_url }}" --commit "${{ github.sha }}" --report test/smoke/out/deployed.json
      - name: Keep the deployed smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-smoke
          path: lateen/test/smoke/out/deployed.json
          if-no-files-found: ignore
