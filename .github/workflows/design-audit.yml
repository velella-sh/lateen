name: design-audit

# Shoots every layout and the component gallery in the default look (light and dark, left-to-right
# and right-to-left, at 375, 768 and 1280 px) and uploads the shots and index.json as an artifact.
# The defect list in docs/design/audit-0.2.6.md links to a run of this workflow. Nothing is committed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/design-audit.ts
      - test/visual/**
      - visual/**

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lateen
          persist-credentials: false
      - uses: ./lateen/.github/actions/setup
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: lateen
      - name: Build the UI assets
        run: npm run ui:build
        working-directory: lateen
      - name: Shoot the audit matrix
        run: node scripts/design-audit.ts --shoot --out audit-shots
        working-directory: lateen
      - name: Upload the audit shots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-audit
          path: lateen/audit-shots
          retention-days: 90
